# The Xcode project for the iOS wrapper, as XcodeGen reads it (https://github.com/yonaskolb/XcodeGen).
# The .xcodeproj, Info.plist and the www folder are generated by the build and are not kept in the repository:
#   mkdir -p ios/www && cp -R index.html manifest.webmanifest src art ui fx fonts sfx icons ios/www/
#   cd ios && xcodegen generate
name: NACRE
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  NACRE:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: www
        type: folder
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NACRE
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.nacre.duels
        PRODUCT_NAME: NACRE
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # built unsigned: whoever installs it signs it (AltStore, Sideloadly, TrollStore, or Xcode with their own team)
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
